name: E10 checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eufy_event_gateway_e10x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eufy_event_gateway_e10x/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:shell
      - run: npm run test:e10
      - run: npm run build
