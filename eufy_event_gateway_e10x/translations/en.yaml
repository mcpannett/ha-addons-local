configuration:
  experimental_s340_smooth_live:
    name: Smooth S340 live view (experimental)
    description: Add six seconds of buffering for smoother SoloCam S340 live view through HomeBase 3. Keeps live audio. Off by default. Hardware behaviour needs confirmation.
  experimental_low_cpu_h265_conversion:
    name: Low-CPU H.265 live view conversion (experimental)
    description: For hosts whose converted H.265 live views fall behind. Converts every second picture, at most 720 lines high. A 1080p view becomes 1280x720 at half the picture rate; an NVR Both view becomes 640x720, so each lens is 640x360. Off by default. Confirmed only on a Home Assistant Green with an S350.
  experimental_homebase_event_names:
    name: Experimental HomeBase familiar-name recovery
    description: "Off by default. For T8210 through HomeBase 3 only, check the exact notification-owned history record for a late familiar name. Skips active views and recordings. Does not ring again or change camera settings."
  experimental_homebase_event_images:
    name: Experimental HomeBase picture recovery
    description: Try the matching recording thumbnail when a cloud event picture is missing. Limited to T8113-Z cameras on HomeBase 3. The recovered thumbnail may have lower resolution. Leaves the last good picture in place if no exact match is available. Off by default.
  experimental_event_image_request:
    name: Retired event picture request test (ignored)
    description: Retired after comparison with the current Eufy app. Existing settings are accepted, but this option has no effect. Pictures use authenticated requests.
  experimental_cloud_recordings:
    name: Experimental cloud recording test
    description: Request an existing private cloud recording in Diagnostics with explicit consent. Video only. Local HomeBase recordings and deletion are separate. Off by default.
  experimental_doorbell_rtc:
    name: Experimental standalone doorbell video test
    description: Enable a consented ten-second private video test in Diagnostics for a standalone Video Doorbell C30. Normal streaming stays unchanged. Hardware behaviour is unconfirmed. Off by default.
  experimental_general_rtc:
    name: Experimental general camera video test
    description: Enable a consented ten-second private video test in Diagnostics for a supported camera on the owner account. A guest account is refused. The Eufy live-view PIN you enter is sent to Eufy and is not stored. Excludes cameras on an NVR and the T8224 doorbell. Hardware behaviour is unconfirmed. Off by default.
  experimental_nvr_controls:
    name: Experimental NVR control tests
    description: Enable separately consented camera-power and Schedule-to-Home restoration tests for T8E00 through T8N00 in Diagnostics. Requires the other experimental options. A lost connection can require manual restoration. Off by default.
  experimental_nvr_live:
    name: Experimental NVR video test
    description: Enable a consented ten-second private video test in Diagnostics for T8E00 cameras through T8N00 or T9000. Hardware behaviour is unconfirmed. Off by default.
  experimental_t8420_live:
    name: Experimental T8420 live video
    description: Try an alternate live start for the original standalone T8420. Off by default. No camera settings or controls are changed. Hardware behaviour in EMS is unconfirmed.
  experimental_nvr_mode_observer:
    name: Experimental NVR mode watcher
    description: Keep a read-only connection for mode changes without opening live video. Limited to one T8N00 with a T8E00 camera. The initial mode stays unknown until it changes. Hardware support is unconfirmed. Off by default. Disable before manual NVR power or arming trials.
  experimental_nvr_region:
    name: Experimental video service region
    description: Select auto, us, eu or ie. GB-style accounts may require ie even when auto selects eu. This is a service region, not the account country.
  experimental_model_controls:
    name: Experimental model controls
    description: Enable exact-model control trials in the diagnostics page. Requires manual observation and restoration. Hardware support is unconfirmed. Off by default.
  raw_message_history:
    name: Private raw message history
    description: Record application traffic privately for retrospective debugging. Encrypted local storage retains up to 24 hours or 1 GiB. Contains sensitive device and account data. Excluded from normal diagnostic exports. Off by default.
  capture_failed_event_images:
    name: Capture failed event images
    description: Private diagnostic capture for 30 minutes after startup. Export within 60 minutes. May contain household images and identifiers. Disable after collecting evidence.
  experimental_e10_signal_tolerance:
    name: E10 signal tolerance
    description: off, log or tolerate. Logs (value-free) or ignores unexpected E10 signalling while video keeps flowing. Default off.
  experimental_e10_signal_grace_ms:
    name: E10 signal grace (ms)
    description: With tolerate, how long video may pause after an ignored message before the call fails. Default 3000.
  experimental_e10_call_rollover_lead_s:
    name: E10 call rollover lead (s)
    description: 0 = off. Otherwise start the next E10 call this many seconds before the per-call limit so live view stays continuous. 5 to 120.
  experimental_e10_call_limit_s:
    name: E10 per-call limit (s)
    description: The service's E10 call limit used for rollover timing. Default 300.
  experimental_e10_rollover_mode:
    name: E10 rollover mode
    description: sequential (default) hangs up the old call before placing the next. overlap runs two calls briefly for a seamless switch.
  experimental_e10_health_guard:
    name: E10 health guard
    description: Replace an E10 call whose video thins out or stops sending keyframes. Default on.
  experimental_e10_reconnect_on_refusal:
    name: E10 reconnect after refusal
    description: Rebuild the session with backoff when the service refuses an E10 call. Default on.
  experimental_e10_no_relay:
    name: E10 no relay (LAN only)
    description: Do not use the service's video relay for E10 calls, so video can only flow directly on your network. If the camera cannot be reached directly, live view fails. Default off.
  experimental_e10_route_log:
    name: E10 route log
    description: Log whether each E10 call's video took the LAN, a NAT route or the relay. No addresses are logged. Default on.
  experimental_e10_local_stream_key:
    name: E10 local stream key
    description: Optional. At least 24 characters. When set, /api/cameras/<serial>/live.ts?key=<key> serves E10 live video for go2rtc or Frigate. Only E10 stream URLs accept it. Leave empty to turn off.
  username:
    name: Eufy username
    description: Dedicated guest Eufy account shared with the required cameras.
  password:
    name: Eufy password
    description: Password for the dedicated guest Eufy account.
  country:
    name: Country
    description: Two-letter country code for the Eufy account, such as GB.
  verification_code:
    name: Verification code
    description: Temporary email code requested by Eufy during first sign-in. Remove it after the app connects.
network:
  3218/tcp: Gateway API
